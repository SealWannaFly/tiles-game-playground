<div class="grid grid-gap-24">
  <div class="col-4">
    <div class="global-map">
      <canvas
        #gameGlobalMap
        [width]="canvasWidth()"
        [height]="canvasHeight()"
      >
      </canvas>
    </div>
  </div>
  <div class="col-2">
    <form class="flex column gap-24" [formGroup]="form" (ngSubmit)="generateMap()">
      <label class="flex justify-between align-center gap-8">
        <p>Семечко:</p>
        <p>{{ seed() }}</p>
      </label>

      <label class="flex justify-between align-center gap-8">
        <p>Размер:</p>
        <input type="number" formControlName="size">
      </label>

      <button type="submit">Сгенерировать</button>
    </form>
    <button class="mt-24" (click)="drawHexMap()">Нарисовать</button>
  </div>
</div>
