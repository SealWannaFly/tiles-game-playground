<div class="grid grid-gap-24">
  <div class="col-4">
    <div class="global-map flex justify-around">
      <canvas
        #gameGlobalMap
        [width]="canvasSize"
        [height]="canvasSize"
        (wheel)="onCanvasWheel($event)"
        draggable="true"
        (dragstart)="onCanvasDragStart($event)"
        (dragend)="onCanvasDragEnd($event)"
        (click)="onClick($event)"
      >
      </canvas>
    </div>
  </div>
  <div class="col-2">
    <form class="flex column gap-16" [formGroup]="form" (ngSubmit)="generateMap()">
      <label class="flex justify-between align-center gap-8">
        <p>Семечко:</p>
        <input type="text" formControlName="seed">
      </label>

      <label class="flex justify-between align-center gap-8">
        <p>Семечко в числовом виде:</p>
        <p>{{ numericSeed() }}</p>
      </label>

      <label class="flex justify-between align-center gap-8">
        <p>Размер:</p>
        <input type="number" formControlName="size">
      </label>

      <button type="submit">Сгенерировать</button>
    </form>
    <div class="mt-24">
      <button class="mt-24" (click)="drawMap()">Нарисовать</button>
    </div>
    <div class="mt-24">
      <button class="mt-24" (click)="logUnknownSprites()">Вывести список неизвестных тайлов</button>
    </div>
    <div class="mt-24">
      Selected Tile = {{ selectedTile | json }}
    </div>
  </div>
</div>
